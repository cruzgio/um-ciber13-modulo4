# Bloque B · Pod carrito endurecido (versión de rescate, cumple B2 y B3)
apiVersion: v1
kind: Pod
metadata:
  name: carrito
  namespace: tienda
  labels: {app: carrito}
spec:
  securityContext:
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: carrito
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    securityContext:
      privileged: false
      runAsNonRoot: true
      runAsUser: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
    resources:
      limits: {cpu: "250m", memory: "128Mi"}
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir: {}
