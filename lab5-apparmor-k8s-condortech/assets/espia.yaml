# Demo de Intro (docente): un Pod privilegiado monta el disco del host y lo lee
apiVersion: v1
kind: Pod
metadata:
  name: espia
  namespace: default
spec:
  hostPID: true
  containers:
  - name: espia
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    securityContext: {privileged: true}
    volumeMounts:
    - {name: host, mountPath: /host}
  volumes:
  - name: host
    hostPath: {path: /}
