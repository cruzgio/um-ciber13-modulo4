# Zona B de Cóndor Tech, tal como la dejó el proveedor. Tres Pods en el namespace tienda.
apiVersion: v1
kind: Pod
metadata:
  name: catalogo
  namespace: tienda
  labels: {app: catalogo}
spec:
  containers:
  - name: catalogo
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
---
apiVersion: v1
kind: Pod
metadata:
  name: pagos-worker
  namespace: tienda
  labels: {app: pagos}
spec:
  containers:
  - name: pagos
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    env:
    - name: PASARELA_TOKEN
      value: "sk_live_3f9a-NO-DEBERIA-ESTAR-AQUI"
---
apiVersion: v1
kind: Pod
metadata:
  name: carrito-legacy
  namespace: tienda
  labels: {app: carrito}
spec:
  hostPID: true
  containers:
  - name: carrito
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: host
      mountPath: /host
  volumes:
  - name: host
    hostPath:
      path: /
