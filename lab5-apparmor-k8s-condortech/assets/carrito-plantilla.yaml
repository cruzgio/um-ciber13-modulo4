# Bloque B · Versión endurecida del Pod carrito — PLANTILLA. Completa los ____ y aplica con kubectl.
apiVersion: v1
kind: Pod
metadata:
  name: carrito
  namespace: tienda
  labels: {app: carrito}
spec:
  # B3 (extra): perfil seccomp por defecto para todo el Pod
  # securityContext:
  #   seccompProfile: {type: RuntimeDefault}
  containers:
  - name: carrito
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    securityContext:
      privileged: ____          # false: sin acceso al host
      runAsNonRoot: ____        # true: el proceso no es root dentro del contenedor
      runAsUser: ____           # un UID > 0, por ejemplo 10001
      readOnlyRootFilesystem: ____   # true: la imagen es inmutable en ejecución
      # B3 (extra):
      # allowPrivilegeEscalation: false
      # capabilities: {drop: ["ALL"]}
    resources:
      limits:
        cpu: ____               # por ejemplo "250m"
        memory: ____            # por ejemplo "128Mi"
    # Sin hostPath. Si el contenedor necesita escribir algo temporal, se usa un emptyDir:
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir: {}
